---
layout: default
title: Blog
---

<h1>Blog</h1>

<ul>
  {% assign blog_pages = site.pages | where_exp: "page", "page.path contains 'blog/' and page.name != 'index.html'" | sort: "date" | reverse %}

  {% for page in blog_pages %}
    <li>
      <a href="{{ page.url }}">{{ page.title }}</a>
      <small>{{ page.date | date: "%B %d, %Y" }}</small>
    </li>
  {% endfor %}
</ul>
